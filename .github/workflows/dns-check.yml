# websites-NN/.github/workflows/dns-check.yml — 원본 site-ops/tools/deploy/dns-check.yml (sync_to_websites.sh 로 복사)
# 수동 실행: 도메인(쉼표 목록)의 NS · apex A/CNAME · www CNAME 을 공개 리졸버(1.1.1.1, 8.8.8.8)로 조회해 annotation 으로 남긴다.
# 한 실행에 도메인 10곳 이하(GitHub 은 step 당 annotation 10개까지만 표시).
# 용도: 존 이동 체크리스트의 "현재 NS" 기입, NS 변경 후 전파 확인(새 NS 가 보이면 check_live 단계로). 세션은 DNS 조회가 막혀 있어 Actions 에서 본다.
name: dns-check
on:
  workflow_dispatch:
    inputs:
      domains:
        description: '도메인 (쉼표로 여러 곳)'
        required: true
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: lookup
        env:
          DOMAINS: ${{ inputs.domains }}
        run: |
          IFS=',' read -ra DS <<< "$DOMAINS"
          for d in "${DS[@]}"; do
            d=$(echo "$d" | tr -d ' '); [ -z "$d" ] && continue
            ns1=$(dig +short NS "$d" @1.1.1.1 | sort | tr '\n' ' ')
            ns8=$(dig +short NS "$d" @8.8.8.8 | sort | tr '\n' ' ')
            # 위임(레지스트리) 기준 NS: 공개 리졸버 캐시(옛 존의 NS TTL 86400)와 무관하게 실제 위임이 바뀌었는지 본다
            case "$d" in *.kr) REG=b.dns.kr;; *.com) REG=a.gtld-servers.net;; *.net) REG=a.gtld-servers.net;; *) REG=;; esac
            nsauth=$( [ -n "$REG" ] && dig +norecurse +noall +authority NS "$d" @$REG 2>/dev/null | awk '$4=="NS"{print $5}' | sort -u | tr '\n' ' ')
            a=$(dig +short A "$d" @1.1.1.1 | sort | tr '\n' ' ')
            www=$(dig +short "www.$d" @1.1.1.1 | sort | tr '\n' ' ')
            echo "::notice::[$d] NS(1.1.1.1)= ${ns1:-없음} | NS(8.8.8.8)= ${ns8:-없음} | NS(레지스트리 위임)= ${nsauth:-조회 불가} | A= ${a:-없음} | www= ${www:-없음}"
          done
