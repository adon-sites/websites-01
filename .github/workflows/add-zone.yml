# websites-NN/.github/workflows/add-zone.yml — 원본 site-ops/tools/deploy/add-zone.yml (sync_to_websites.sh 로 복사)
# 수동 실행: 도메인 1곳(또는 쉼표 목록)에 DNS 더미 A/CNAME + Workers 라우트를 넣는다 (존은 사용자가 대시보드에서 먼저 추가).
# --create-zone 은 기본 꺼짐(존 추가는 사용자가 네임서버 값을 눈으로 확인해야 하므로).
name: add-zone
on:
  workflow_dispatch:
    inputs:
      domains:
        description: '도메인 (쉼표로 여러 곳)'
        required: true
      create_zone:
        description: '존도 API 로 추가 (네임서버는 로그/annotation 에 출력)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  zone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          IFS=',' read -ra DS <<< "${{ inputs.domains }}"
          for d in "${DS[@]}"; do d=$(echo "$d" | xargs); [ -z "$d" ] && continue
            if [ "${{ inputs.create_zone }}" = "true" ]; then python3 tools/cf/add_zone.py "$d" --all 2>&1 | tee out.txt; else python3 tools/cf/add_zone.py "$d" --dns --route 2>&1 | tee out.txt; fi
            while IFS= read -r line; do echo "::notice::[$d] $line"; done < out.txt
          done
